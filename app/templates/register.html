{% extends 'base.html' %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      </span>
      <span><b>科目一模拟考试系统</b><span>机动车驾驶人考试平台</span></span>
    </div>
    <h1>创建账号</h1>
    <p class="auth-sub">注册后即可开始模拟考试与练习</p>
    <form method="post">
      <div class="field">
        <label>账号</label>
        <input type="text" name="username" required autocomplete="username" placeholder="用于登录的用户名">
      </div>
      <div class="field">
        <label>姓名</label>
        <input type="text" name="real_name" required maxlength="50" placeholder="请填写真实姓名（老师用来登记成绩）">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" name="password" required autocomplete="new-password" placeholder="设置登录密码">
      </div>
      <button class="btn" type="submit">注册</button>
    </form>
    <div class="auth-back">已有账号？<a href="{{ url_for('login') }}">返回登录</a></div>
  </div>
</div>
{% endblock %}
