{% extends 'base.html' %}
{% block content %}
<div class="card auth">
  <h2>登录</h2>
  <form method="post">
    <label>账号</label>
    <input type="text" name="username" required>
    <label>密码</label>
    <input type="password" name="password" required>
    <button class="btn" type="submit">登录</button>
    <a class="btn secondary" href="{{ url_for('register') }}">注册</a>
  </form>
</div>
{% endblock %}
