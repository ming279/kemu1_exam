{% extends 'base.html' %}
{% block content %}
<div class="card auth">
  <h2>注册</h2>
  <form method="post">
    <label>账号</label>
    <input type="text" name="username" required>
    <label>姓名</label>
    <input type="text" name="real_name" required maxlength="50" placeholder="请填写真实姓名（老师用来登记成绩）">
    <label>密码</label>
    <input type="password" name="password" required>
    <button class="btn" type="submit">注册</button>
  </form>
  <p class="muted" style="margin-top:12px;">已有账号？<a href="{{ url_for('login') }}">返回登录</a></p>
</div>
{% endblock %}
