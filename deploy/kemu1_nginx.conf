# =============================================================================
# kemu1_exam 的 Nginx 反向代理配置
# 用法：
#   sudo cp deploy/kemu1_nginx.conf /etc/nginx/sites-available/kemu1
#   sudo ln -sf /etc/nginx/sites-available/kemu1 /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl restart nginx
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 上传图片最大 20MB（题目图片一般 <500KB，留足余量）
    client_max_body_size 20m;

    # 减少代理层缓存干扰（Flask flash/session cookie 必须透传）
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:5000;

        # 基础头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 必需：Socket.io PK 对战靠这个
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 长连接 + 心跳不超时
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
